<ion-content [fullscreen]="true">
  <form [formGroup]="form" class="info-container" (ngSubmit)="submit()">
    <div class="disclaimer">
      Para melhorar sua experiência <br />
      precisamos de alguns dados
    </div>

    <div class="form">
      <div class="form-input-full">
        <ion-input
          [disabled]="isLoading"
          aria-label="Nome Completo"
          placeholder="Nome Completo"
          class="form-input"
          formControlName="name"
        ></ion-input>
      </div>

      <div class="form-input-half">
        <ion-input
          [disabled]="isLoading"
          aria-label="Idade"
          placeholder="Idade"
          type="number"
          class="form-input"
          formControlName="age"
        ></ion-input>
        <ion-select
          [disabled]="isLoading"
          aria-label="Sexo"
          placeholder="Sexo"
          formControlName="sex"
          class="form-input"
          interface="popover"
          justify="space-between"
        >
          <ion-select-option value="m">Masculino</ion-select-option>
          <ion-select-option value="f">Feminino</ion-select-option>
          <ion-select-option value="o">Outro</ion-select-option>
        </ion-select>
      </div>

      <div class="form-input-half">
        <ion-input
          [disabled]="isLoading"
          aria-label="Altura (cm)"
          placeholder="Altura (cm)"
          type="number"
          class="form-input"
          formControlName="height"
        ></ion-input>
        <ion-input
          [disabled]="isLoading"
          aria-label="Peso (kg)"
          placeholder="Peso (kg)"
          class="form-input"
          formControlName="weight"
        ></ion-input>
      </div>

      <div class="disclaimer">
        <p>Quando você começou a tomar medicações?</p>
      </div>

     <div class="form-input-full">
      <ion-datetime-button class="form-input" datetime="datetime"></ion-datetime-button>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="datetime"
            formControlName="medication_started_at"
            presentation="date"
            [disabled]="isLoading"
            aria-label="Data de início da medicação"
            preferWheel="false"
          ></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>
    </div>

    <div class="image-container">
      <img src="assets/img/brain.svg" alt="Ilustração" />
    </div>

    <div class="button-container">
      <ion-button
        expand="block"
        color="success"
        class="submit-button"
        type="submit"
        [disabled]="form.invalid"
      >
        <ion-spinner *ngIf="isLoading"></ion-spinner>
        Finalizar Cadastro
      </ion-button>
    </div>
  </form>
</ion-content>
