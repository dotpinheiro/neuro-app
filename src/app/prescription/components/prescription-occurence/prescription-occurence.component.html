<ion-card class="ionCard">
  <ion-card-content>
    <ion-list>
      <ion-item *ngFor="let prescriptionItem of userPrescriptions">
        <ion-thumbnail slot="start">
          <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
        </ion-thumbnail>
        <ion-grid>
          <ion-row>
            <div><span style="font-weight: bold;">Doutor: </span>{{prescriptionItem.doctor_name}}</div>
          </ion-row>
          <ion-row>
            <ion-col>
              <div>
                <span style="font-weight: bold;">Data Inicio: </span>{{formatDate(prescriptionItem.issue_date)}}
              </div>
            </ion-col>
            <ion-col>
              <div>
                <span style="font-weight: bold;">Data Fim: </span>{{formatDate(prescriptionItem.expiration_date)}}
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </ion-list>
  </ion-card-content>
</ion-card>
